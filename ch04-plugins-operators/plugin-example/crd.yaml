# Custom Resource Definition for the example plugin — Chapter 4
# Apply with: kubectl apply -f crd.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: examples.example.nuvolaris.org
spec:
  group: example.nuvolaris.org
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  default: 1
                version:
                  type: string
                  default: "1.0.0"
                storage:
                  type: string
                  default: "1Gi"
  scope: Namespaced
  names:
    plural: examples
    singular: example
    kind: Example
